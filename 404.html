<style>
:root { --bg:#ffffff; --ink:#0b1b33; --ink-muted:#0b1b33a3; --ink-dim:#0b1b3370; --line:#0b1b3324; --field:#ffffff; --accent:#0071e3; --accent-deep:#0062d6; --on-accent:#ffffff; --glow:#0071e33d; --red:#d93025; }
@media (prefers-color-scheme: dark) { :root { --bg:#081120; --ink:#e9eef7; --ink-muted:#e9eef7ad; --ink-dim:#e9eef770; --line:#e9eef72e; --field:#0f1b2e; --accent:#3d95ff; --accent-deep:#2f86f0; --glow:#3d95ff3d; --red:#f0625a; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "Inter", -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
form { margin: auto; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.mark { width: 88px; height: 88px; border-radius: 19px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 49px; font-weight: 700; box-shadow: 0 14px 40px var(--glow); }
.word { font-size: 34px; font-weight: 700; letter-spacing: -.03em; margin-top: 4px; }
.sub, .foot, label { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink-muted); text-align: center; }
.sub { margin-bottom: 14px; }
label { align-self: flex-start; letter-spacing: .12em; text-transform: uppercase; font-size: 10.5px; color: var(--ink-dim); margin-bottom: -8px; }
input, select, button { width: 100%; height: 52px; border-radius: 12px; font: inherit; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 14px; }
input, select { border: 1px solid var(--line); background: var(--field); color: var(--ink); padding: 0 14px; text-align: center; }
input:focus-visible, select:focus-visible { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
button { border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }
button:hover { background: var(--accent-deep); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.err { color: var(--red); font-size: 13px; font-weight: 600; min-height: 18px; text-align: center; }
.foot { letter-spacing: .14em; text-transform: uppercase; font-size: 10.5px; color: var(--ink-dim); padding-top: 16px; }
</style>
</head>

const STORE = 'vyb_desk_key', DAYS = 14;
const un = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = id => document.getElementById(id);
async function unseal(key) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(P.nonce) }, key, un(P.ct));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
async function fromCode(code) {
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(code.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: un(P.salt), iterations: P.iters, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
(async () => {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && saved.exp > Date.now()) {
      await unseal(await crypto.subtle.importKey('raw', un(saved.k), 'AES-GCM', false, ['decrypt']));
      return;
    }
  } catch (e) { try { localStorage.removeItem(STORE); } catch (x) {} }
  $('f').hidden = false; $('code').focus();
})();
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  $('err').textContent = ''; $('go').disabled = true; $('go').textContent = 'Checking…';
  try {
    const key = await fromCode($('code').value);
    const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(P.nonce) }, key, un(P.ct));
    try { localStorage.setItem(STORE, JSON.stringify({ k: btoa(String.fromCharCode(...raw)), exp: Date.now() + DAYS * 864e5 })); } catch (x) {}
    document.cookie = 'vyb_desk_seat=' + $('seat').value + '; path=/; max-age=' + DAYS * 86400 + '; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '');
    await unseal(key);
  } catch (err) {
    $('err').textContent = 'That access code is not right. Try again.';
    $('go').disabled = false; $('go').textContent = 'Enter'; $('code').select();
  }
});
})();
